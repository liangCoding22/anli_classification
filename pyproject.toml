[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anli-classification"
version = "0.2.0"
description = "Prompt-based ANLI (NLI) classification via the Fireworks API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "datasets>=2.20.0",
  "openai>=1.40.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
anli-eval = "anli_classification.cli:main"
anli-batch-report = "anli_classification.batch_report:main"
anli-training-pool = "anli_classification.training_pool:main"
anli-rl-train = "anli_classification.rl_train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
